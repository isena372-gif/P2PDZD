<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f4fd8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="P2P USDT">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>حاسبة P2P USDT</title>
<style>
  :root {
    --paper:#eef2f7; --card:#fff; --ink:#13233f; --muted:#5d6b82; --line:#d3dbe7;
    --accent:#1f4fd8; --accent-ink:#fff; --result:#fff4cc; --result-ink:#3d2d00;
    --second:#e3ecff; --second-ink:#10265c; --manual:#fff0d6; --danger:#b3261e;
    --lossbg:#fde4e1; --gain:#13795b; --tagbuy:#dfe8ff; --tagbuy-ink:#17389a; --tagsell:#d9f3e8; --tagsell-ink:#0d5a43;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper:#0e1626; --card:#16213a; --ink:#e8eefb; --muted:#9aa9c4; --line:#2b3a5c;
      --accent:#7da2ff; --accent-ink:#0e1626; --result:#3a2f0a; --result-ink:#ffe9a3;
      --second:#1d2c52; --second-ink:#d6e3ff; --manual:#3a2f0a; --danger:#ff8a80;
      --lossbg:#3b1714; --gain:#4fd1a1; --tagbuy:#1d2c52; --tagbuy-ink:#bcd0ff; --tagsell:#12382d; --tagsell-ink:#9ff0cf; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink);
    font-family:"Noto Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif; line-height:1.6; -webkit-text-size-adjust:100%; }
  main { max-width:620px; margin:0 auto; padding:16px 14px 48px; }
  .head { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  h1 { font-size:1.25rem; margin:6px 0 4px; }
  h2 { font-size:1rem; margin:0 0 8px; }
  .info { display:inline-flex; align-items:center; justify-content:center; vertical-align:middle;
    width:13px; height:13px; padding:0; margin-inline-end:5px; border:1.3px solid currentColor; border-radius:50%;
    background:transparent; color:inherit; opacity:.7; font-size:.55rem; font-weight:800; line-height:1; position:relative; }
  .info::after { content:""; position:absolute; inset:-8px; }
  .info:hover, .info[aria-expanded="true"] { opacity:1; }
  .tabcell { position:relative; }
  .tabcell > button:not(.info) { width:100%; padding-right:24px; }
  .tabcell > #tabTarget { font-size:clamp(.85rem, 4vw, 1rem); white-space:normal; line-height:1.3; text-wrap:balance; }
  .tabcell > .info { position:absolute; right:6px; top:50%; margin:0; transform:translateY(-50%); z-index:2; color:var(--muted); }
  #settingsBtn { font-size:1.2rem; line-height:1; padding:7px 12px; }
  #settingsBtn[aria-expanded="true"] { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .headact { display:flex; align-items:center; gap:6px; }
  .tip { position:fixed; z-index:60; max-width:min(300px, calc(100vw - 24px)); background:var(--ink); color:var(--paper);
    border-radius:12px; padding:12px 14px; box-shadow:0 8px 26px rgba(0,0,0,.3); animation:tipIn .16s ease-out; }
  .tip .tt { font-weight:800; font-size:.92rem; margin-bottom:4px; }
  .tip .td { font-size:.86rem; line-height:1.6; opacity:.95; }
  @keyframes tipIn { from { opacity:0; transform:scale(.96); } to { opacity:1; transform:none; } }
  .sh { font-size:.95rem; margin:18px 0 8px; padding-top:14px; border-top:1px solid var(--line); }
  .sh:first-child { margin-top:0; padding-top:0; border-top:0; }
  .switch { display:flex; align-items:center; gap:12px; margin:16px 0 8px; cursor:pointer; font-size:.95rem; }
  .switch input { position:absolute; opacity:0; width:1px; height:1px; }
  .slider { direction:ltr; position:relative; flex:0 0 46px; width:46px; height:26px; border-radius:26px; background:var(--line); transition:background .2s; }
  .slider::after { content:""; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .2s; }
  .switch input:checked + .slider { background:var(--accent); }
  .switch input:checked + .slider::after { transform:translateX(20px); }
  .switch input:focus-visible + .slider { outline:3px solid var(--accent); outline-offset:2px; }
  #bmTable { transition:opacity .2s; }
  #bmTable.off { opacity:.4; }
  .seg { display:flex; gap:6px; }
  .seg button { flex:1; border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:10px; padding:9px 6px; font-weight:700; }
  .seg button[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  [hidden] { display:none !important; }
  button, input { touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  button { transition:transform .12s ease, background-color .15s, opacity .15s; }
  .btn:active:not(:disabled), .btn2:active { transform:scale(.97); }
  .stp:active { transform:scale(.92); }
  input { transition:border-color .15s, background-color .2s, box-shadow .15s; }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(31,79,216,.18); }
  .page-in { animation:pageIn .24s ease-out; }
  @keyframes pageIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .bump { display:inline-block; animation:bump .32s ease-out; }
  @keyframes bump { from { opacity:.35; transform:translateY(5px) scale(.97); } to { opacity:1; transform:none; } }
  #topReal, #topSell, #curReal { display:inline-block; }
  tr.new td { animation:rowFlash 1.1s ease-out; }
  @keyframes rowFlash { from { background:var(--result); } to { background:transparent; } }
  .toast { position:fixed; left:50%; bottom:22px; z-index:50; transform:translate(-50%, 16px); opacity:0; pointer-events:none;
    background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:24px; font-weight:700; font-size:.92rem;
    box-shadow:0 6px 20px rgba(0,0,0,.25); transition:opacity .22s, transform .22s; }
  .toast.show { opacity:1; transform:translate(-50%, 0); }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
  .topbar { position:sticky; top:0; z-index:10; display:grid; grid-template-columns:1.15fr 1fr 1fr; gap:6px;
    background:var(--paper); padding:8px 0 10px; margin-bottom:2px; }
  .tb { border-radius:12px; padding:8px 12px; }
  .tb.a { background:var(--second); color:var(--second-ink); }
  .tb.b { background:var(--result); color:var(--result-ink); }
  .tb { padding:8px 9px; min-width:0; }
  .tb.g { background:var(--card); border:1px solid var(--accent); color:var(--ink); }
  .tb.g label { margin:0 0 4px; color:var(--muted); }
  .tb.g input { font-size:1.15rem; font-weight:700; padding:6px 6px; border-radius:8px; }
  .tb.g .stp-col { flex-basis:30px; }
  .tb.g .stepper { gap:4px; }
  .tb .name { font-size:.72rem; opacity:.9; line-height:1.3; }
  .tb .val { font-size:1.3rem; font-weight:800; line-height:1.25; direction:ltr; text-align:right; font-variant-numeric:tabular-nums; }
  .tb .unit { font-size:.78rem; font-weight:600; }
  .tabs { position:relative; display:grid; grid-template-columns:repeat(3,1fr); gap:6px; background:var(--line); padding:4px; border-radius:12px; margin:8px 0 4px; }
  .tabs::before { content:""; position:absolute; top:4px; bottom:4px; right:4px; width:calc((100% - 20px) / 3);
    background:var(--card); border-radius:9px; box-shadow:0 1px 2px rgba(19,35,63,.2);
    transform:translateX(calc(var(--idx, 0) * -1 * (100% + 6px))); transition:transform .28s cubic-bezier(.3,.8,.3,1); }
  .tabs button:not(.info) { position:relative; z-index:1; border:0; background:transparent; color:var(--muted); font-weight:700; padding:10px 6px; border-radius:9px; transition:color .2s; }
  .tabs button[aria-selected="true"] { color:var(--ink); }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-top:12px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .wide { grid-column:1 / -1; }
  label { display:block; font-size:.85rem; color:var(--muted); margin-bottom:4px; }
  input[type=text], input:not([type]) { width:100%; font:inherit; font-size:1.05rem; color:var(--ink); background:var(--paper);
    border:1px solid var(--line); border-radius:10px; padding:10px 12px; direction:ltr; text-align:right; }
  .stepper { display:flex; direction:ltr; gap:6px; align-items:stretch; }
  .stepper input { flex:1; min-width:0; text-align:right; }
  .stp-col { flex:0 0 40px; display:flex; flex-direction:column; gap:3px; }
  .stp { flex:1; min-height:20px; border:1px solid var(--line); background:var(--paper); color:var(--ink); border-radius:7px;
    font-size:.72rem; line-height:1; padding:0; user-select:none; -webkit-user-select:none;
    -webkit-touch-callout:none; touch-action:manipulation; }
  .stp:active { background:var(--second); }
  input.manual { background:var(--manual); border-color:var(--accent); }
  .small label { font-size:.74rem; line-height:1.3; min-height:2.4em; }
  .small input { font-size:.92rem; padding:7px 8px; }
  .hint { font-size:.76rem; color:var(--muted); margin:8px 0 0; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  .res { border-radius:14px; padding:16px; margin-top:12px; }
  .res.a { background:var(--second); color:var(--second-ink); }
  .res.b { background:var(--result); color:var(--result-ink); }
  .res .name { font-size:.9rem; opacity:.9; }
  .res .big { font-size:2.3rem; font-weight:800; line-height:1.2; direction:ltr; text-align:right; font-variant-numeric:tabular-nums; }
  .res .unit { font-size:.9rem; font-weight:600; }
  .res.mid { padding:12px 14px; margin-top:8px; }
  .res.mid .big { font-size:1.7rem; }
  dl { margin:0; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-top:1px solid var(--line); font-size:.92rem; }
  .row:first-child { border-top:0; }
  .row dt { color:var(--muted); }
  .row dd { margin:0; font-weight:600; direction:ltr; font-variant-numeric:tabular-nums; }
  .gain { color:var(--gain); } .loss { color:var(--danger); }
  button { font:inherit; cursor:pointer; }
  .btn { background:var(--accent); color:var(--accent-ink); border:0; border-radius:10px; padding:11px 16px; font-weight:700; width:100%; margin-top:12px; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .btn2 { background:transparent; color:var(--ink); border:1px solid var(--line); border-radius:9px; padding:7px 12px; font-size:.85rem; }
  .logbar { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .scroll { overflow-x:auto; margin-top:8px; -webkit-overflow-scrolling:touch; }
  table { width:100%; border-collapse:collapse; font-size:.84rem; white-space:nowrap; }
  th,td { padding:8px 8px; text-align:right; border-top:1px solid var(--line); }
  th { font-size:.74rem; color:var(--muted); border-top:0; font-weight:600; }
  td.n { direction:ltr; font-variant-numeric:tabular-nums; }
  td.key { font-weight:700; }
  td input[type=checkbox] { width:20px; height:20px; padding:0; accent-color:var(--accent); }
  tr.off td { opacity:.45; }
  .tag { display:inline-block; padding:1px 10px; border-radius:20px; font-weight:700; font-size:.78rem; }
  .tag.buy { background:var(--tagbuy); color:var(--tagbuy-ink); }
  .tag.sell { background:var(--tagsell); color:var(--tagsell-ink); }
  .x { background:transparent; border:0; color:var(--danger); font-size:1.05rem; padding:2px 8px; }
  .cells { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
  .cell { border-radius:12px; padding:10px 12px; min-width:0; }
  .cell .name { font-size:.78rem; opacity:.9; line-height:1.3; }
  .cell .val { font-size:1.4rem; font-weight:800; line-height:1.3; direction:ltr; text-align:right; font-variant-numeric:tabular-nums; }
  .cell .unit { font-size:.78rem; font-weight:600; }
  .cell.c1 { background:var(--second); color:var(--second-ink); }
  .cell.c2 { background:var(--result); color:var(--result-ink); }
  .cell.c3 { background:var(--paper); border:1px solid var(--line); color:var(--ink); }
  .cell.c4 { background:var(--tagsell); color:var(--tagsell-ink); }
  .cell.c5 { background:var(--lossbg); color:var(--danger); }
  details { margin-top:12px; } summary { cursor:pointer; font-weight:600; padding:6px 0; }
  td .sub { display:block; font-size:.68rem; color:var(--muted); font-weight:400; }
  tr.cur td { background:var(--result); color:var(--result-ink); }
  tr.cur td .sub { color:var(--result-ink); opacity:.75; }
  .empty { color:var(--muted); padding:14px 2px; }

  .head { position:relative; }
  .menu { position:absolute; top:calc(100% + 4px); inset-inline-end:0; z-index:30; min-width:220px; padding:6px;
    background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:0 10px 28px rgba(0,0,0,.22); animation:pageIn .16s ease-out; }
  .menu button { display:flex; width:100%; align-items:center; justify-content:space-between; gap:14px; padding:11px 12px;
    border:0; border-radius:8px; background:transparent; color:var(--ink); font-weight:600; text-align:start; }
  .menu button:hover, .menu button:active { background:var(--paper); }
  .menu small { color:var(--muted); font-weight:700; }
  .spage { position:fixed; inset:0; z-index:40; display:flex; flex-direction:column; background:var(--paper); animation:pageIn .22s ease-out; }
  .sbar { display:flex; align-items:center; gap:10px; padding:12px 14px; background:var(--card); border-bottom:1px solid var(--line); }
  .sbar h2 { margin:0; font-size:1.05rem; }
  .backbtn { display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; padding:0; border:1px solid var(--line);
    border-radius:10px; background:var(--paper); color:var(--ink); }
  html[dir="rtl"] .backbtn svg { transform:scaleX(-1); }
  .sbody { flex:1; overflow:auto; width:100%; max-width:620px; margin:0 auto; padding:16px 14px; -webkit-overflow-scrolling:touch; }
  .sfoot { display:flex; gap:10px; padding:12px 14px calc(12px + env(safe-area-inset-bottom)); background:var(--card); border-top:1px solid var(--line); }
  .sfoot .btn { margin-top:0; width:auto; flex:1.5; }
  .sfoot .btn2 { flex:1; padding:10px 8px; font-size:.9rem; }
  .res, .tb { position:relative; }
  /* محاذاة: العنوان في الأعلى والقيمة/الخانة في الأسفل، فتصطف الأرقام مهما اختلف طول العناوين */
  .grid > div { display:flex; flex-direction:column; justify-content:flex-end; }
  .grid > div > label { margin-bottom:5px; }
  .tb { display:flex; flex-direction:column; justify-content:space-between; }
  .cell { display:flex; flex-direction:column; justify-content:space-between; }
  .mini input:not([type]), .ro { height:40px; padding:0 9px; box-sizing:border-box; }
  .mini .stp { min-height:17px; }
  .copy-btn { position:absolute; top:8px; inset-inline-end:8px; width:26px; height:26px; padding:0; display:inline-flex;
    align-items:center; justify-content:center; border:1.3px solid currentColor; border-radius:8px; background:transparent;
    color:inherit; opacity:.65; }
  .copy-btn:hover, .copy-btn:active { opacity:1; }
  .copy-btn svg { display:block; }
  .tb .copy-btn { top:6px; inset-inline-end:6px; width:22px; height:22px; border-radius:7px; }
  .tb .copy-btn svg { width:12px; height:12px; }
  .res .name { padding-inline-end:34px; }
  .tb.b .name { padding-inline-end:22px; }
  .mini { margin-top:12px; }
  .mini label { font-size:.76rem; line-height:1.3; }
  .mini input:not([type]), .ro { font-size:.92rem; padding:7px 9px; }
  .ro { display:flex; align-items:center; justify-content:flex-end; min-height:38px; font-weight:700; direction:ltr;
    background:var(--paper); border:1px solid var(--line); border-radius:10px; font-variant-numeric:tabular-nums; }
  /* ---- اتجاه LTR (الفرنسية والإنجليزية) ---- */
  html[dir="ltr"] .tabs::before { right:auto; left:4px; transform:translateX(calc(var(--idx, 0) * (100% + 6px))); }
  html[dir="ltr"] .tabcell > .info { right:auto; left:6px; }
  html[dir="ltr"] .tabcell > button:not(.info) { padding-right:6px; padding-left:24px; }
  html[dir="ltr"] input:not([type]) { text-align:left; }
  html[dir="ltr"] .res .big, html[dir="ltr"] .cell .val, html[dir="ltr"] .tb .val { text-align:left; }
  html[dir="ltr"] th, html[dir="ltr"] td { text-align:left; }
  html[dir="ltr"] .ro { justify-content:flex-start; }
  #bkRow { margin-top:14px; }
</style>
</head>
<body>
<main>
  <header class="head">
    <h1 data-i18n="title">حاسبة P2P USDT</h1>
    <button type="button" class="btn2" id="settingsBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="settingsMenu" aria-label="الإعدادات" title="الإعدادات">⚙</button>
    <div class="menu" id="settingsMenu" role="menu" hidden>
      <button type="button" role="menuitem" data-sec="fees"><span data-i18n="menu_fees">إعدادات الرسوم</span></button>
      <button type="button" role="menuitem" data-sec="cur"><span data-i18n="menu_cur">اختيار العملة</span><small id="menuCur"></small></button>
      <button type="button" role="menuitem" data-sec="lang"><span data-i18n="menu_lang">اختيار اللغة</span><small id="menuLang"></small></button>
    </div>
  </header>

  <div class="topbar">
    <div class="tb g">
      <label class="name" for="g"><span data-i18n="lbl_g">الربح المطلوب (دج)</span></label>
      <input id="g" inputmode="decimal" value="2,00" autocomplete="off">
    </div>
    <div class="tb a" role="status" aria-live="polite">
      <div class="name"><span data-i18n="top_real">متوسط التكلفة الفعلية</span></div>
      <div class="val"><span id="topReal">—</span> <span class="unit" data-unit>دج</span></div>
    </div>
    <div class="tb b">
      <button type="button" class="copy-btn" data-src="topSell" aria-label="نسخ القيمة"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button>
      <div class="name"><span data-i18n="top_sell">متوسط سعر البيع المثالي</span></div>
      <div class="val"><span id="topSell">—</span> <span class="unit" data-unit>دج</span></div>
    </div>
  </div>

  <div class="tabs" id="tabs" role="tablist" aria-label="الصفحات">
    <button role="tab" id="tabBuy" aria-selected="true" data-i18n="tab_buy">الشراء</button>
    <button role="tab" id="tabSell" aria-selected="false" data-i18n="tab_sell">البيع</button>
    <button role="tab" id="tabTarget" aria-selected="false" data-i18n="tab_target">سعر الشراء المستهدف</button>
  </div>

  <!-- صفحة الشراء -->
  <section id="pageBuy">
    <div class="panel">
      <div class="grid">
        <div>
          <label for="a"><span data-i18n="lbl_a">مبلغ الشراء (دج)</span></label>
          <input id="a" inputmode="decimal" placeholder="12800" autocomplete="off">
        </div>
        <div>
          <label for="p"><span data-i18n="lbl_p">السعر المعلن (دج/USDT)</span></label>
          <input id="p" inputmode="decimal" placeholder="255,06" autocomplete="off">
        </div>
      </div>
      <div class="grid mini">
        <div id="bkfBox" hidden>
          <label for="bkf"><span data-i18n="lbl_bkf">رسوم التحويل البنكي</span></label>
          <input id="bkf" inputmode="decimal" autocomplete="off">
        </div>
        <div>
          <label id="netqLabel"><span data-i18n="lbl_netq">الكمية الصافية المشتراة (USDT)</span></label>
          <div class="ro"><span id="netQ">—</span></div>
        </div>
      </div>
    </div>

    <div class="res a" role="status" aria-live="polite">
      <button type="button" class="copy-btn" data-src="curReal" aria-label="نسخ القيمة"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></button>
      <div class="name"><span data-i18n="cur_real">التكلفة الفعلية لشراء الوحدة</span></div>
      <div class="big"><span id="curReal">—</span> <span class="unit" data-unit>دج</span></div>
    </div>

    <button class="btn" id="save" disabled data-i18n="btn_save">تسجيل عملية الشراء</button>
  </section>

  <!-- صفحة البيع -->
  <section id="pageSell" hidden>
    <div class="panel">

        html += '<div class="res b"><button type="button" class="copy-btn" data-v="' + tp.toFixed(2) + '" aria-label="' + t("copy_value") + '">' + COPY_ICON + '</button>' +
          '<div class="name">' + t("t_buy_at", fmt(A, 0)) + '</div>' +
          '<div class="big">' + fmt(tp, 2) + ' <span class="unit">' + u + '</span></div></div>';
      }
      html += '<div class="panel"><div class="scroll"><table><thead><tr><th>' + t("th_range") + '</th><th>' + t("th_fee_short") + '</th>' +
        '<th>' + t("th_low") + '</th><th>' + t("th_high") + '</th></tr></thead><tbody>';
      BR.forEach(function (b, i) {
        html += '<tr' + (i === cur ? ' class="cur"' : "") + '><td>' + rangeLabel(b) + '</td><td class="n">' + bf(b.fee) + '</td>' +
          '<td class="n key">' + fmt(targetPrice(S, g, b.low, bf(b.fee), k), 2) + '<span class="sub">' + fmt(b.low, 0) + '</span></td>' +
          '<td class="n key">' + fmt(targetPrice(S, g, b.high, bf(b.fee), k), 2) + '<span class="sub">' + fmt(b.high, 0) + '</span></td></tr>';
      });
      html += '</tbody></table></div></div>';
    } else {
      var fx = txFee(1);
      if (hasA) {
        var tpx = targetPrice(S, g, A, fx, k);
        html += '<div class="res b"><button type="button" class="copy-btn" data-v="' + tpx.toFixed(2) + '" aria-label="' + t("copy_value") + '">' + COPY_ICON + '</button>' +
          '<div class="name">' + t("t_buy_at", fmt(A, 2)) + '</div>' +
          '<div class="big">' + fmt(tpx, 2) + ' <span class="unit">' + u + '</span></div></div>';
      }
      html += '<div class="panel"><div class="scroll"><table><thead><tr><th>' + t("th_amount") + '</th><th>' + t("th_fee_short") + '</th>' +
        '<th>' + t("th_target") + '</th></tr></thead><tbody>';
      REF.forEach(function (r) {
        html += '<tr><td class="n">' + fmt(r, 0) + '</td><td class="n">' + fmt(fx, 2) + '</td><td class="n key">' + fmt(targetPrice(S, g, r, fx, k), 2) + '</td></tr>';
      });
      html += '</tbody></table></div></div>';
    }
    out.innerHTML = html;
  }
  ["ts", "ta", "g", "fb", "fs", "bk"].forEach(function (id) { $(id).addEventListener("input", calcTarget); });
  $("g").addEventListener("input", persist);

  /* ---------- التبويبات ---------- */
  var PAGES = { buy: ["pageBuy", "tabBuy"], sell: ["pageSell", "tabSell"], target: ["pageTarget", "tabTarget"] };
  function showPage(name) {
    var idx = 0;
    Object.keys(PAGES).forEach(function (k, i) {
      var on = k === name;
      if (on) idx = i;
      $(PAGES[k][0]).hidden = !on;
      $(PAGES[k][1]).setAttribute("aria-selected", on);
    });
    $("tabs").style.setProperty("--idx", idx);
    animateIn($(PAGES[name][0]));
    if (name === "sell") refreshSell();
    if (name === "target") calcTarget();
  }
  $("tabBuy").addEventListener("click", function () { showPage("buy"); });
  $("tabSell").addEventListener("click", function () { showPage("sell"); });
  $("tabTarget").addEventListener("click", function () { showPage("target"); });

  /* ---------- أيقونات الشرح (!) ---------- */
  function mkInfo(key) {
    var b = document.createElement("button");
    b.type = "button"; b.className = "info"; b.setAttribute("data-tip", key);
    b.setAttribute("aria-label", "شرح"); b.textContent = "!";
    return b;
  }
  function addInfo(el, key, before) {
    if (!el) return;
    el.insertBefore(mkInfo(key), before || el.firstChild);
  }
  ["a", "p", "g", "sq", "sp", "ts", "ta", "fb", "fs", "bk", "bkf"].forEach(function (id) {
    addInfo(document.querySelector('label[for="' + id + '"]'), id);
  });
  addInfo($("netqLabel"), "netq");
  addInfo(document.querySelector(".tb.a .name"), "topReal");
  addInfo(document.querySelector(".tb.b .name"), "topSell");
  addInfo(document.querySelector(".res.a .name"), "curReal");
  addInfo(document.querySelector("label.switch"), "bm", document.querySelector("label.switch .slider"));
  (function () {
    var btn = $("settingsBtn"), w = document.createElement("div");
    w.className = "headact";
    btn.parentNode.insertBefore(w, btn);
    w.appendChild(mkInfo("settings"));
    w.appendChild(btn);
  })();
  ["tabBuy", "tabSell", "tabTarget"].forEach(function (id) {
    var b = $(id), w = document.createElement("div");
    w.className = "tabcell";
    b.parentNode.insertBefore(w, b);
    w.appendChild(b);
    w.appendChild(mkInfo(id));
  });

  var tipBtn = null;
  function hideTip() {
    $("tip").hidden = true;
    if (tipBtn) { tipBtn.setAttribute("aria-expanded", "false"); tipBtn = null; }
  }
  function showTip(btn) {
    var d = (TIPS[lang] || TIPS.ar)[btn.getAttribute("data-tip")]; if (!d) return;
    var tip = $("tip");
    tip.querySelector(".tt").textContent = fill(d[0]);
    tip.querySelector(".td").textContent = fill(d[1]);
    tip.hidden = false;
    var r = btn.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    var left = Math.min(Math.max(12, r.left + r.width / 2 - w / 2), window.innerWidth - w - 12);
    var top = r.bottom + 10;
    if (top + h > window.innerHeight - 10) top = Math.max(10, r.top - h - 10);
    tip.style.left = left + "px"; tip.style.top = top + "px";
    tipBtn = btn; btn.setAttribute("aria-expanded", "true");
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest(".info");
    if (b) {
      e.preventDefault();           // لا تفعّل الخانة أو المفتاح المرتبط بالعنوان
      if (tipBtn === b) hideTip(); else { hideTip(); showTip(b); }
      return;
    }
    if (!e.target.closest("#tip")) hideTip();
  });
  window.addEventListener("scroll", hideTip, { passive: true });
  window.addEventListener("resize", hideTip);
  document.addEventListener("keydown", function (e) {
    if (e.key !== "Escape") return;
    hideTip();
    if (!$("settingsPage").hidden) cancelSettings(); else closeMenu();
  });

  /* ---------- الإعدادات ---------- */
  function segUI(id, val) {
    Array.prototype.forEach.call($(id).querySelectorAll("button"), function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-v") === val);
    });
  }
  /* --- القائمة المنسدلة --- */
  function closeMenu() {
    $("settingsMenu").hidden = true;
    $("settingsBtn").setAttribute("aria-expanded", "false");
  }
  $("settingsBtn").addEventListener("click", function () {
    var m = $("settingsMenu"), open = m.hidden;
    hideTip();
    m.hidden = !open;
    this.setAttribute("aria-expanded", open);
    if (open) animateIn(m);
  });
  document.addEventListener("click", function (e) {
    if (!$("settingsMenu").hidden && !e.target.closest("#settingsMenu") && !e.target.closest("#settingsBtn")) closeMenu();
  });
  $("settingsMenu").addEventListener("click", function (e) {
    var b = e.target.closest("[data-sec]"); if (b) openSettings(b.getAttribute("data-sec"));
  });

  /* --- صفحة التعديل (مسودة: لا يُثبَّت شيء إلا بزر «حفظ») --- */
  var SEC = { fees: ["secFees", "menu_fees"], cur: ["secCur", "menu_cur"], lang: ["secLang", "menu_lang"] };
  var snap = null, curSec = null, draftCur = "DZD", draftLang = "ar";
  function setTitle(sec) {
    var el = $("setTitle");
    el.textContent = t(SEC[sec][1]);
    if (sec === "cur" || sec === "lang") {
      var i = mkInfo(sec); i.setAttribute("aria-label", t("explain"));
      el.insertBefore(i, el.firstChild);
    }
  }
  function openSettings(sec) {
    closeMenu(); hideTip();
    curSec = sec;
    snap = { fb: $("fb").value, fs: $("fs").value, bk: $("bk").value, bm: baridiOn };
    draftCur = curr; draftLang = lang;
    segUI("curSeg", draftCur); segUI("langSeg", draftLang);
    Object.keys(SEC).forEach(function (k) { $(SEC[k][0]).hidden = k !== sec; });
    setTitle(sec);
    $("settingsPage").hidden = false;
    $("setBody").scrollTop = 0;
    document.body.style.overflow = "hidden";
  }
  function closeSettings() {
    $("settingsPage").hidden = true;
    document.body.style.overflow = "";
    curSec = null; snap = null; hideTip();
  }
  function cancelSettings() {
    if (snap) {
      $("fb").value = snap.fb; $("fs").value = snap.fs; $("bk").value = snap.bk; baridiOn = snap.bm;
      syncFeeUI(); calc(); calcTarget();
    }
    closeSettings();
  }
  function saveSettings() {
    var changed = draftCur !== curr || draftLang !== lang;
    curr = draftCur; lang = draftLang;
    persist();
    closeSettings();
    if (changed) applyI18n(); else { calc(); calcTarget(); }
    toast(t("toast_saved"));
  }
  function resetSettings() {
    if (curSec === "fees") {
      $("fb").value = "0,2"; $("fs").value = "0,2"; $("bk").value = "0,00"; baridiOn = true;
      syncFeeUI(); calc(); calcTarget();
    } else if (curSec === "cur") { draftCur = "DZD"; segUI("curSeg", draftCur); }
    else if (curSec === "lang") { draftLang = "ar"; segUI("langSeg", draftLang); }
  }
  $("setBack").addEventListener("click", cancelSettings);
  $("setSave").addEventListener("click", saveSettings);
  $("setReset").addEventListener("click", resetSettings);
  $("bm").addEventListener("change", function () {
    baridiOn = this.checked;
    syncFeeUI();
    calc(); calcTarget();
  });
  $("curSeg").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    draftCur = b.getAttribute("data-v"); segUI("curSeg", draftCur);
  });
  $("langSeg").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    draftLang = b.getAttribute("data-v"); segUI("langSeg", draftLang);
  });
  function syncFeeUI() {
    var dz = curr === "DZD";
    $("bm").checked = baridiOn;
    $("bmTable").hidden = !dz;
    $("bmTable").classList.toggle("off", !baridiOn);
    $("bkRow").hidden = dz;
    $("bk").disabled = !baridiOn;
    syncBuyFee();
  }

  /* ---------- تطبيق اللغة والعملة ---------- */
  function applyI18n() {
    hideTip();
    var h = document.documentElement;
    h.lang = lang; h.dir = lang === "ar" ? "rtl" : "ltr";
    document.title = t("title");
    Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function (el) {
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-unit]"), function (el) { el.textContent = unit(); });
    $("settingsBtn").setAttribute("aria-label", t("settings")); $("settingsBtn").title = t("settings");
    $("tabs").setAttribute("aria-label", t("pages"));
    $("langSeg").setAttribute("aria-label", t("sec_lang"));
    $("curSeg").setAttribute("aria-label", t("sec_cur"));
    $("logs").setAttribute("aria-label", t("log_title"));
    Array.prototype.forEach.call(document.querySelectorAll(".info"), function (b) { b.setAttribute("aria-label", t("explain")); });
    Array.prototype.forEach.call(document.querySelectorAll(".stp"), function (b) {
      b.setAttribute("aria-label", t(b.getAttribute("data-dir") === "up" ? "up" : "down"));
    });
    Array.prototype.forEach.call(document.querySelectorAll(".copy-btn"), function (b) { b.setAttribute("aria-label", t("copy_value")); });
    $("menuCur").textContent = curr === "EUR" ? "€" : curr === "USD" ? "$" : "DZD";
    $("menuLang").textContent = { ar: "عربي", fr: "Français", en: "English" }[lang];
    $("setBack").setAttribute("aria-label", t("back"));
    segUI("langSeg", lang); segUI("curSeg", curr);
    syncFeeUI();
    renderBmTable();
    calc(); calcTarget(); renderLog();
  }

  restore();
  applyI18n();
})();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
</body>
